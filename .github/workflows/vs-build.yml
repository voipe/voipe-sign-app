# VoIPe Sign fork — build & publish the app image (Track F0/F3). Upstream workflows are removed on vs/* branches.
name: vs-build

on:
  push:
    branches: ['vs/main']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vs-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          echo "version=$(tr -d '[:space:]' < vs/VERSION)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:sha-${{ steps.v.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
